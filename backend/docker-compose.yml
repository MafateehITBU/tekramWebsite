services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mafateeh
    ports:
      # Host 5433 avoids clashing with a local PostgreSQL install on 5432
      - "5433:5432"
    volumes:
      - mafateeh_pg:/var/lib/postgresql/data

volumes:
  mafateeh_pg:
