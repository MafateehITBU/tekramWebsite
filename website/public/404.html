<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 — Page not found | Tikram Arabia</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/webp" href="/logo-02.webp" />
    <style>
      :root {
        --primary: #00502e;
        --secondary: #dfb026;
        --white: #fefefe;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: Montserrat, Roboto, ui-sans-serif, system-ui, sans-serif;
        background: var(--primary);
        color: var(--white);
      }
      header {
        padding: 1.25rem 1.5rem;
      }
      header img {
        display: block;
        height: 2.75rem;
        width: auto;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.25rem 4rem;
      }
      .code {
        margin: 0;
        font-size: clamp(5rem, 22vw, 8rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(135deg, #fff 0%, var(--secondary) 55%, #fff 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        margin: 1.25rem 0 0;
        max-width: 22rem;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.2;
      }
      p {
        margin: 1rem 0 0;
        max-width: 26rem;
        font-family: Roboto, ui-sans-serif, system-ui, sans-serif;
        font-size: 1.0625rem;
        line-height: 1.6;
        color: rgba(254, 254, 254, 0.88);
      }
      .hint {
        font-size: 0.9375rem;
        color: rgba(254, 254, 254, 0.65);
      }
      .home-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        min-width: 10.5rem;
        margin-top: 2rem;
        padding: 0.75rem 2rem;
        border-radius: 0.5rem;
        background: var(--secondary);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      .home-btn:hover {
        filter: brightness(1.08);
      }
      .logo-link {
        display: inline-block;
        text-decoration: none;
      }
      html[dir='rtl'] body {
        font-family: Tahoma, 'Noto Naskh Arabic', ui-sans-serif, sans-serif;
      }
    </style>
    <script>
      try {
        var path = location.pathname || ''
        var ar =
          path === '/ar' ||
          path.indexOf('/ar/') === 0 ||
          localStorage.getItem('tikram-arabia-locale') === 'ar'
        if (ar) {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <header>
      <a class="logo-link" href="/" aria-label="Tikram Arabia home">
        <img src="/logo-02.webp" width="180" height="72" alt="Tikram Arabia" />
      </a>
    </header>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1 data-en="Page not found" data-ar="الصفحة غير موجودة">Page not found</h1>
      <p
        data-en="The page you’re looking for doesn’t exist or may have been moved. Let’s get you back on track."
        data-ar="الصفحة التي تبحث عنها غير موجودة أو ربما تم نقلها. دعنا نعيدك إلى المسار الصحيح."
      >
        The page you’re looking for doesn’t exist or may have been moved. Let’s get you back on
        track.
      </p>
      <p class="hint" data-en="Check the URL or return to the homepage." data-ar="تحقق من الرابط أو عد إلى الصفحة الرئيسية.">
        Check the URL or return to the homepage.
      </p>
      <a class="home-btn" href="/" data-en="Back to home" data-ar="العودة للرئيسية">Back to home</a>
    </main>
    <script>
      if (document.documentElement.lang === 'ar') {
        document.querySelectorAll('[data-ar]').forEach(function (el) {
          el.textContent = el.getAttribute('data-ar')
        })
        var home = document.querySelector('.home-btn')
        if (home) home.setAttribute('href', '/ar')
      }
    </script>
  </body>
</html>
