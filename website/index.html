<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tikram Arabia delivers IT solutions, digital marketing, and branding services for businesses across Saudi Arabia."
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo-02.png" />
    <link rel="icon" type="image/webp" href="/logo-02.webp" />
    <link rel="apple-touch-icon" href="/logo-02.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://tikramarabia.com/" />
    <link rel="alternate" hreflang="en" href="https://tikramarabia.com/" />
    <link rel="alternate" hreflang="ar" href="https://tikramarabia.com/ar" />
    <link rel="alternate" hreflang="x-default" href="https://tikramarabia.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tikram Arabia" />
    <meta property="og:title" content="Tikram Arabia" />
    <meta
      property="og:description"
      content="IT solutions, digital marketing, and branding in Saudi Arabia."
    />
    <meta property="og:url" content="https://tikramarabia.com/" />
    <meta property="og:image" content="https://tikramarabia.com/logo-02.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tikram Arabia" />
    <meta
      name="twitter:description"
      content="IT solutions, digital marketing, and branding in Saudi Arabia."
    />
    <meta name="twitter:image" content="https://tikramarabia.com/logo-02.png" />
    <title>Tikram Arabia</title>
    <style>
      html,body{margin:0;background:#00502e;color:#fff}
      #lcp-hero{
        position:absolute;z-index:12;left:1rem;right:1rem;top:6rem;
        margin:0 auto;max-width:36rem;
        font:700 1.875rem/1.25 system-ui,-apple-system,Segoe UI,sans-serif;
        text-align:center;pointer-events:none;
      }
      html[dir=rtl] #lcp-hero{text-align:right}
      @media (min-width:768px){#lcp-hero{display:none!important}}
      html:not([data-home]) #lcp-hero{display:none!important}
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Tikram Arabia",
        "url": "https://tikramarabia.com/",
        "logo": "https://tikramarabia.com/logo-02.png"
      }
    </script>
    <script>
      try {
        var path = location.pathname.replace(/\/$/, '') || '/'
        var isAr = path === '/ar' || path.indexOf('/ar/') === 0
        if (isAr) {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
        }
        if (path === '/' || path === '/ar') {
          document.documentElement.setAttribute('data-home', '')
        }
        if (localStorage.getItem('tikram-arabia-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (_) {}
    </script>
    <script>
      (function () {
        var href =
          'https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap'
        function addFonts() {
          var l = document.createElement('link')
          l.rel = 'stylesheet'
          l.href = href
          document.head.appendChild(l)
        }
        try {
          if (window.innerWidth >= 768) {
            var p = document.createElement('link')
            p.rel = 'preconnect'
            p.href = 'https://fonts.googleapis.com'
            document.head.appendChild(p)
            var p2 = document.createElement('link')
            p2.rel = 'preconnect'
            p2.href = 'https://fonts.gstatic.com'
            p2.crossOrigin = 'anonymous'
            document.head.appendChild(p2)
            addFonts()
          } else {
            window.addEventListener('load', function () {
              setTimeout(addFonts, 1200)
            })
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <noscript>
      <div style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font-family: sans-serif">
        <h1>Tikram Arabia</h1>
        <p>
          JavaScript is required for the full Tikram Arabia website experience. Please enable
          JavaScript or contact us at the details on our homepage.
        </p>
      </div>
    </noscript>
    <p id="lcp-hero" role="heading" aria-level="1">In a World Full of Uncertainty…Choose Proven Results</p>
    <div id="root"></div>
    <script>
      try {
        if (document.documentElement.lang === 'ar') {
          var el = document.getElementById('lcp-hero')
          if (el) el.textContent = 'وسط فوضى الاحتمالات… اختر النتائج المضمونة'
        }
      } catch (_) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
