<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tikram Arabia delivers IT solutions, digital marketing, and branding services for businesses across Saudi Arabia."
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo-02.png" />
    <link rel="icon" type="image/webp" href="/logo-02.webp" />
    <link rel="apple-touch-icon" href="/logo-02.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://tikramarabia.com/" />
    <link rel="alternate" hreflang="en" href="https://tikramarabia.com/" />
    <link rel="alternate" hreflang="ar" href="https://tikramarabia.com/ar" />
    <link rel="alternate" hreflang="x-default" href="https://tikramarabia.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tikram Arabia" />
    <meta property="og:title" content="Tikram Arabia" />
    <meta
      property="og:description"
      content="IT solutions, digital marketing, and branding in Saudi Arabia."
    />
    <meta property="og:url" content="https://tikramarabia.com/" />
    <meta property="og:image" content="https://tikramarabia.com/logo-02.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tikram Arabia" />
    <meta
      name="twitter:description"
      content="IT solutions, digital marketing, and branding in Saudi Arabia."
    />
    <meta name="twitter:image" content="https://tikramarabia.com/logo-02.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      />
    </noscript>
    <title>Tikram Arabia</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Tikram Arabia",
        "url": "https://tikramarabia.com/",
        "logo": "https://tikramarabia.com/logo-02.png"
      }
    </script>
    <script>
      try {
        var path = location.pathname.replace(/\/$/, '') || '/'
        if (path === '/ar' || path.indexOf('/ar/') === 0) {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
        }
        if (localStorage.getItem('tikram-arabia-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <noscript>
      <div style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font-family: sans-serif">
        <h1>Tikram Arabia</h1>
        <p>
          JavaScript is required for the full Tikram Arabia website experience. Please enable
          JavaScript or contact us at the details on our homepage.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
