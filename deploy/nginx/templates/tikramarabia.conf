# Copy this file to the Mafateeh nginx conf.d folder (Mafateeh keeps 80/443):
#   cp deploy/nginx/templates/tikramarabia.conf /opt/mafateehwebsite/deploy/nginx/conf.d/tikramarabia.conf
#
# Ensure Mafateeh reverse-proxy has host access (add to mafateeh docker-compose if missing):
#   extra_hosts:
#     - "host.docker.internal:host-gateway"
#
# If host.docker.internal does not work, replace it with your docker bridge IP:
#   ip -4 route show default | awk '{print $3}'

server {
  listen 80;
  server_name tikramarabia.com www.tikramarabia.com api.tikramarabia.com dashboard.tikramarabia.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name tikramarabia.com www.tikramarabia.com;

  ssl_certificate /etc/letsencrypt/live/tikramarabia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tikramarabia.com/privkey.pem;

  location / {
    proxy_pass http://host.docker.internal:9081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  server_name api.tikramarabia.com;

  ssl_certificate /etc/letsencrypt/live/tikramarabia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tikramarabia.com/privkey.pem;

  location / {
    proxy_pass http://host.docker.internal:9080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  server_name dashboard.tikramarabia.com;

  ssl_certificate /etc/letsencrypt/live/tikramarabia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tikramarabia.com/privkey.pem;

  location /api/ {
    proxy_pass http://host.docker.internal:9080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://host.docker.internal:9082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
