# Copy to: /opt/mafateehwebsite/deploy/nginx/conf.d/tikramarabia.conf
#
# Tikram runs on the HOST at ports 9081 (web), 9082 (dashboard), 9080 (api).
# Replace TIKRAM_HOST below with the docker gateway IP on your VPS:
#   cd /opt/mafateehwebsite
#   docker compose -f deploy/docker-compose.prod.yml exec -T reverse-proxy ip route | awk '/default/ {print $3}'
# Usually 172.17.0.1

server {
  listen 80;
  server_name tikramarabia.com www.tikramarabia.com api.tikramarabia.com dashboard.tikramarabia.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name www.tikramarabia.com;

  ssl_certificate /etc/letsencrypt/live/tikramarabia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tikramarabia.com/privkey.pem;

  return 301 https://tikramarabia.com$request_uri;
}

server {
  listen 443 ssl;
  server_name tikramarabia.com;

  ssl_certificate /etc/letsencrypt/live/tikramarabia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tikramarabia.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://172.17.0.1:9081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  server_name api.tikramarabia.com;

  ssl_certificate /etc/letsencrypt/live/tikramarabia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tikramarabia.com/privkey.pem;

  location / {
    proxy_pass http://172.17.0.1:9080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  server_name dashboard.tikramarabia.com;

  ssl_certificate /etc/letsencrypt/live/tikramarabia.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tikramarabia.com/privkey.pem;

  location /api/ {
    proxy_pass http://172.17.0.1:9080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://172.17.0.1:9082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
